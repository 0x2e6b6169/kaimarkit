# kaimarkit — Betrieb hinter Traefik mit Authelia davor.
#
# Dritte Schicht, nie allein aufrufen:
#   docker compose -f docker/docker-compose.yml \
#                  -f docker/docker-compose.traefik.yml \
#                  -f docker/docker-compose.authelia.yml up -d
#
# Diese Datei startet Authelia nicht mit. Sie erwartet einen laufenden
# Authelia-Dienst im Traefik-Netz und verweist nur auf ihn.
#
# Beide Router zeigen voreingestellt auf "authelia@docker" — die Middleware, die
# eine per Docker-Label beschriftete Authelia an sich selbst definiert. Wessen
# Authelia anders beschriftet ist, traegt "kaimarkit-auth@docker" ein und nutzt
# damit die Middleware, die diese Datei weiter unten selbst definiert.
# docs/betrieb/authelia.md erklaert beide Wege.

services:
  kaimarkit:
    # Listenform wie in der Traefik-Schicht, aus demselben Grund: Router- und
    # Middlewarename stehen im Labelnamen, und nur in der Listenform ist der
    # Labelname Teil eines Wertes, in den Compose einsetzen kann. Compose macht
    # aus beiden Listen beim Laden Maps und fuehrt sie ueber die Schluessel
    # zusammen — diese Datei ersetzt also weiterhin einzelne Eintraege der
    # Traefik-Schicht und haengt kein zweites Label daneben.
    #
    # ${KAIMARKIT_TRAEFIK_NAME} ist derselbe Namensraum wie dort und muss es
    # sein: Die Middleware haengt an dem Router, den jene Schicht anlegt.
    labels:
      # Die eigene Middleware. Sie definiert sich am eigenen Dienst und steht
      # damit fuer sich: Traefik findet sie ueber den Docker-Anbieter, ohne dass
      # eine zweite Datei sie beisteuern muss. Daher der Zusatz "@docker"
      # ueberall dort, wo sie benannt wird.
      #
      # Voreingestellt benutzt sie kein Router mehr — sie ist der Weg fuer alle,
      # deren Authelia keine eigene Docker-Middleware mitbringt. Definiert bleibt
      # sie trotzdem immer.
      #
      # Bleibt AUTHELIA_VERIFY_URL leer, entsteht eine Definition mit leerer
      # Adresse. Traefik nimmt sie hin, solange kein Router sie benutzt: Bei
      # Traefik 3.6.25 stand sie unter /api/http/middlewares auf "enabled", ohne
      # Fehler und ohne Eintrag im Log. Deshalb braucht diese Definition keine
      # Bedingung. Wer sie dagegen leer benutzt, bekommt 500 — nachgemessen,
      # nicht angenommen.
      - "traefik.http.middlewares.${KAIMARKIT_TRAEFIK_NAME:-kaimarkit}-auth.forwardauth.address=${AUTHELIA_VERIFY_URL}"

      # Authelia braucht die urspruengliche Anfrage, um Schema, Host und Pfad zu
      # pruefen und danach zurueckzuleiten. Ohne diesen Schalter sieht Authelia
      # nur Traefik.
      - "traefik.http.middlewares.${KAIMARKIT_TRAEFIK_NAME:-kaimarkit}-auth.forwardauth.trustForwardHeader=true"

      # Was Authelia ueber die angemeldete Person zurueckgibt, reicht Traefik an
      # die Anwendung weiter. kaimarkit wertet die Kopfzeilen nicht aus; sie
      # stehen bereit, falls spaeter jemand danach unterscheiden will.
      - "traefik.http.middlewares.${KAIMARKIT_TRAEFIK_NAME:-kaimarkit}-auth.forwardauth.authResponseHeaders=${AUTHELIA_RESPONSE_HEADERS}"

      # Der Router aus der Traefik-Schicht bekommt die Middleware vorgeschaltet.
      # Neuer Schluessel in derselben Map, deshalb bleibt dort alles ungeaendert.
      #
      # Voreingestellt "authelia@docker": Wer Authelia betreibt und sie per
      # Docker-Label beschriftet hat, verweist damit auf seine vorhandene
      # Middleware und setzt nichts doppelt. Wer das nicht hat, traegt
      # "${KAIMARKIT_TRAEFIK_NAME}-auth@docker" ein und setzt AUTHELIA_VERIFY_URL
      # — der Name der eigenen Middleware folgt dem Namensraum.
      #
      # Der Vorgabewert steht hier und nicht nur in .env.example, damit ein
      # docker/.env ohne diese Variable nicht die leere Zeichenkette einsetzt.
      # Leer hiesse "keine Middleware", und eine fehlende Zeile darf nicht in
      # einen ungeschuetzten Dienst muenden.
      #
      # Deshalb "-" und nicht ":-". Der Doppelpunkt wuerde auch den leeren Wert
      # ersetzen; ohne ihn greift der Vorgabewert nur, wenn die Variable ganz
      # fehlt. Ein ausdruecklich leerer Wert bleibt leer und heisst "keine
      # Middleware", wie beim /api-Router weiter unten. Beim Namensraum daneben
      # steht es umgekehrt: Dort ergibt ein leerer Wert nichts Sinnvolles.
      #
      # Die nächste Zeile führt beide Formen nebeneinander, und das bleibt so.
      # Wer sie vereinheitlicht, nimmt zwei Angaben weg, die
      # docs/betrieb/authelia.md beschreibt: Ein leeres KAIMARKIT_API_MIDDLEWARES
      # lässt ein curl ohne Browsersitzung an /api durch, ein leeres
      # KAIMARKIT_MIDDLEWARES gibt die Oberfläche frei. Mit ":-" wäre beides
      # nicht mehr einstellbar.
      - "traefik.http.routers.${KAIMARKIT_TRAEFIK_NAME:-kaimarkit}.middlewares=${KAIMARKIT_MIDDLEWARES-authelia@docker}"

      # Zweiter Router allein fuer /api. Hinter Authelia bekommt ein Aufruf ohne
      # Browser-Sitzung sonst eine Weiterleitung zum Login. curl und jedes
      # Skript bekaemen dann die Anmeldeseite statt Markdown.
      - "traefik.http.routers.${KAIMARKIT_TRAEFIK_NAME:-kaimarkit}-api.rule=Host(`${KAIMARKIT_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.${KAIMARKIT_TRAEFIK_NAME:-kaimarkit}-api.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.${KAIMARKIT_TRAEFIK_NAME:-kaimarkit}-api.tls=true"
      - "traefik.http.routers.${KAIMARKIT_TRAEFIK_NAME:-kaimarkit}-api.tls.certresolver=${TRAEFIK_CERTRESOLVER}"

      # Traefik ordnet Regeln sonst nach Laenge. Das genuegt hier zwar, weil die
      # /api-Regel die laengere ist, haengt aber am Wortlaut der anderen Regel.
      # Die feste Zahl macht den Vorrang unabhaengig davon.
      - "traefik.http.routers.${KAIMARKIT_TRAEFIK_NAME:-kaimarkit}-api.priority=100"

      # Ein Router ohne eigenen Dienst nimmt den einzigen des Containers. Hier
      # steht er trotzdem, damit niemand diese Regel nachschlagen muss.
      - "traefik.http.routers.${KAIMARKIT_TRAEFIK_NAME:-kaimarkit}-api.service=${KAIMARKIT_TRAEFIK_NAME:-kaimarkit}"

      # Derselbe Schalter fuer /api, mit derselben Voreinstellung: Beide Router
      # gehen denselben Weg, solange niemand sie auseinanderzieht.
      #
      # Ein leerer Wert gibt die API frei: Traefik nimmt ihn als "keine
      # Middleware" an, der Router bleibt aktiv und meldet keinen Fehler.
      # Geprueft mit Traefik 3.6.7 — der Router stand auf "enabled", die
      # Middlewareliste war leer, und ein Aufruf kam durch, waehrend derselbe
      # Aufruf auf "/" an Authelia haengenblieb.
      #
      # Die Anfuehrungszeichen um das ganze Label schreiben die leere
      # Zeichenkette hin, statt sie YAML zu ueberlassen — ein blanker Wert
      # stuende dort fuer null.
      #
      # Statt ganz freizugeben laesst sich hier auch eine engere Middleware
      # eintragen, etwa eine IP-Allowlist. Siehe docs/betrieb/authelia.md.
      - "traefik.http.routers.${KAIMARKIT_TRAEFIK_NAME:-kaimarkit}-api.middlewares=${KAIMARKIT_API_MIDDLEWARES-authelia@docker}"
