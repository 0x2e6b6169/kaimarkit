site_name: kaimarkit
site_description: Dokumente nach Markdown wandeln und den Kontext sehen, den ein LLM bekommt
# Die veroeffentlichte Fassung steht auf GitHub Pages; der Container liefert
# dieselben Dateien unter /docs/ aus. Ein site_url nennt nur eine der beiden
# Adressen, und die oeffentliche ist die richtige.
#
# Der Wert steht im fertigen Bau an genau zwei Stellen: im <link rel="canonical">
# jeder Seite und in der sitemap.xml. Navigation und Versionsmenue rechnen zur
# Laufzeit aus der Basis der geoeffneten Seite; welcher Pfad hier steht, aendert
# an ihnen nichts.
site_url: https://0x2e6b6169.github.io/kaimarkit/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: de
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Auf helle Darstellung umschalten
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Auf dunkle Darstellung umschalten
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Der Systemeinstellung folgen

extra:
  version:
    provider: mike
    default: latest

plugins:
  - search:
      lang: de
  # mike haengt beim Veroeffentlichen die Fassung an site_url. Ohne Eintrag
  # zeigte der kanonische Verweis jeder Fassung auf sich selbst; so zeigen alle
  # auf die neueste.
  #
  # Der Eintrag gehoert hierher, weil mike das Plugin sonst mit Standardwerten
  # selbst einhaengt; einstellen laesst es sich nur als eigener Eintrag.
  # "version_selector" bleibt dabei unberuehrt: Materials Vorlage fragt ihn ab
  # und schaltet den eigenen Waehler ab, sobald er false ist.
  - mike:
      canonical_version: latest

markdown_extensions:
  - admonition
  - attr_list
  # Ohne def_list rendert eine Definitionsliste als Absatz mit fuehrendem
  # Doppelpunkt. mkdocs build --strict meldet das nicht.
  - def_list
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Start: index.md
  - Für Nutzer:
      - Eine Datei wandeln: nutzer/dateien-wandeln.md
      - Eine Webseite wandeln: nutzer/webseiten-wandeln.md
      - Engine und Texterkennung wählen: nutzer/engine-und-texterkennung.md
      - Warnungen und Fehler verstehen: nutzer/warnungen-und-fehler.md
  - Für Admins:
      - Schnellstart: admin/schnellstart.md
      - Lokaler Betrieb: admin/lokal.md
      - Konfiguration: admin/konfiguration.md
      - Formate und Engines: admin/formate.md
      - Hinter Traefik: admin/traefik.md
      - Anmeldung mit Authelia: admin/authelia.md
      - Grenzen: admin/grenzen.md
      - API: admin/api.md
  - Entwicklung: entwicklung.md
